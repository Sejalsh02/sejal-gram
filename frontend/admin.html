<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Post Composer | Admin Panel</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f6fb;
            color: #1f2937;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            width: 230px;
            height: 100vh;
            background: #111827;
            color: white;
            padding: 25px 18px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 40px;
        }

        .sidebar a {
            display: block;
            color: #d1d5db;
            text-decoration: none;
            padding: 13px 15px;
            margin-bottom: 8px;
            border-radius: 8px;
        }

        .sidebar a:hover {
            background: #374151;
            color: white;
        }

        /* Main */
        .main {
            margin-left: 230px;
            padding: 30px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
        }

        .logout {
            background: #ef4444;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 7px;
            cursor: pointer;
        }

        /* Stats */
        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .card h3 {
            color: #6b7280;
            margin-bottom: 10px;
        }

        .number {
            font-size: 32px;
            font-weight: bold;
        }

        /* Tables */
        .section {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .section h2 {
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            text-align: left;
            padding: 13px;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #f9fafb;
        }

        .delete-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 7px 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        @media(max-width: 800px) {

            .sidebar {
                width: 180px;
            }

            .main {
                margin-left: 180px;
            }

            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- Sidebar -->
    <div class="sidebar">

        <div class="logo">
            ✦ Post Composer
        </div>

        <a href="index.html">Dashboard</a>
        <a href="admin.html">Admin Panel</a>

    </div>


    <!-- Main Content -->
    <div class="main">

        <div class="header">

            <div>
                <h1>Admin Panel</h1>
                <p>Manage users and posts</p>
            </div>

            <button class="logout" onclick="logout()">
                Logout
            </button>

        </div>


        <!-- Statistics -->
        <div class="stats">

            <div class="card">
                <h3>Total Users</h3>
                <div class="number" id="totalUsers">0</div>
            </div>

            <div class="card">
                <h3>Total Posts</h3>
                <div class="number" id="totalPosts">0</div>
            </div>

        </div>


        <!-- Users -->
        <div class="section">

            <h2>Users</h2>

            <table>

                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="usersTable">
                </tbody>

            </table>

        </div>


        <!-- Posts -->
        <div class="section">

            <h2>Posts</h2>

            <table>

                <thead>
                    <tr>
                        <th>Title</th>
                        <th>Author</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="postsTable">
                </tbody>

            </table>

        </div>

    </div>


    <script>

        const API = "http://localhost:5000";

        const token = localStorage.getItem("token");


        // Check login
        if (!token) {

            alert("Please login first.");

            window.location.href = "login.html";

        }


        // Load statistics
        async function loadStats() {

            try {

                const response = await fetch(
                    `${API}/api/admin/stats`,
                    {
                        headers: {
                            Authorization: `Bearer ${token}`
                        }
                    }
                );

                const data = await response.json();

                if (!response.ok) {

                    alert(data.message);

                    return;

                }

                document.getElementById("totalUsers").textContent =
                    data.stats.totalUsers;

                document.getElementById("totalPosts").textContent =
                    data.stats.totalPosts;

            } catch (error) {

                console.error(error);

            }

        }


        // Load users
        async function loadUsers() {

            try {

                const response = await fetch(
                    `${API}/api/admin/users`,
                    {
                        headers: {
                            Authorization: `Bearer ${token}`
                        }
                    }
                );

                const data = await response.json();

                if (!response.ok) {

                    alert(data.message);

                    return;

                }

                const table =
                    document.getElementById("usersTable");

                table.innerHTML = "";

                data.users.forEach(user => {

                    table.innerHTML += `
                        <tr>

                            <td>${user.name}</td>

                            <td>${user.email}</td>

                            <td>${user.role || "user"}</td>

                            <td>

                                <button
                                    class="delete-btn"
                                    onclick="deleteUser('${user._id}')">
                                    Delete
                                </button>

                            </td>

                        </tr>
                    `;

                });

            } catch (error) {

                console.error(error);

            }

        }


        // Load posts
        async function loadPosts() {

            try {

                const response = await fetch(
                    `${API}/api/admin/posts`,
                    {
                        headers: {
                            Authorization: `Bearer ${token}`
                        }
                    }
                );

                const data = await response.json();

                if (!response.ok) {

                    alert(data.message);

                    return;

                }

                const table =
                    document.getElementById("postsTable");

                table.innerHTML = "";

                data.posts.forEach(post => {

                    table.innerHTML += `
                        <tr>

                            <td>${post.title}</td>

                            <td>
                                ${post.author
                                    ? post.author.name
                                    : "Unknown"}
                            </td>

                            <td>

                                <button
                                    class="delete-btn"
                                    onclick="deletePost('${post._id}')">
                                    Delete
                                </button>

                            </td>

                        </tr>
                    `;

                });

            } catch (error) {

                console.error(error);

            }

        }


        // Delete user
        async function deleteUser(id) {

            if (!confirm("Delete this user?")) {
                return;
            }

            const response = await fetch(
                `${API}/api/admin/users/${id}`,
                {
                    method: "DELETE",

                    headers: {
                        Authorization: `Bearer ${token}`
                    }
                }
            );

            const data = await response.json();

            alert(data.message);

            loadStats();
            loadUsers();

        }


        // Delete post
        async function deletePost(id) {

            if (!confirm("Delete this post?")) {
                return;
            }

            const response = await fetch(
                `${API}/api/admin/posts/${id}`,
                {
                    method: "DELETE",

                    headers: {
                        Authorization: `Bearer ${token}`
                    }
                }
            );

            const data = await response.json();

            alert(data.message);

            loadStats();
            loadPosts();

        }


        // Logout
        function logout() {

            localStorage.removeItem("token");

            window.location.href = "login.html";

        }


        // Initial loading
        loadStats();
        loadUsers();
        loadPosts();

    </script>

</body>
</html>
