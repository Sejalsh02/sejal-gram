<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Post</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">
    <div class="card">

        <h2>Edit Post</h2>

        <form id="editForm">

            <input
                type="text"
                id="title"
                placeholder="Post Title"
                required
            >

            <textarea
                id="content"
                rows="6"
                placeholder="Post Content"
                required
            ></textarea>

            <button type="submit">
                Update Post
            </button>

        </form>

        <br>

        <button onclick="window.location.href='index.html'">
            Back
        </button>

    </div>
</div>

<script src="js/editPost.js"></script>

</body>
</html>
