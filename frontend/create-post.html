<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Post | Post Composer</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">

    <div class="card">

        <h2>Create New Post</h2>

        <form id="postForm">

            <!-- Post Title -->
            <input
                type="text"
                id="title"
                name="title"
                placeholder="Enter Post Title"
                required
            >

            <!-- Post Content -->
            <textarea
                id="content"
                name="content"
                placeholder="Write your post..."
                rows="6"
                required
            ></textarea>

            <!-- Image -->
            <label for="image">
                Upload Image
            </label>

            <input
                type="file"
                id="image"
                name="image"
                accept="image/png, image/jpeg, image/jpg, image/gif, image/webp"
            >

            <!-- Image Preview -->
            <div id="imagePreview"></div>

            <!-- Schedule Post -->
            <label for="scheduledAt">
                Schedule Post
            </label>

            <input
                type="datetime-local"
                id="scheduledAt"
                name="scheduledAt"
            >

            <small>
                Leave empty to publish immediately.
            </small>

            <!-- Create Post -->
            <button type="submit">
                Create Post
            </button>

        </form>

        <br>

        <!-- Back to Dashboard -->
        <button onclick="window.location.href='index.html'">
            Back to Dashboard
        </button>

    </div>

</div>

<script src="js/createPost.js"></script>

</body>
</html>
